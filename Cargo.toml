# Rust workspace. vault, uploader and api-client join when their sub-task
# starts (CLAUDE.md section 2); the desktop binary itself arrives with L3.1.
[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/desktop/src-tauri/crates/audio-engine",
    "apps/desktop/src-tauri/crates/vault",
    "tools/nb-capture",
    "tools/nb-testsignal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
