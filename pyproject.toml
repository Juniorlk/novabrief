# Tooling configuration for the whole Python side of the monorepo.
# No application dependency is declared here yet: FastAPI, SQLAlchemy, Celery
# and the provider SDKs arrive with the backend lot (CLAUDE.md section 2).

[project]
name = "novabrief"
version = "0.1.0"
description = "NovaBrief — monorepo tooling root (Novafrik)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.0",
    "sqlalchemy[asyncio]==2.0.45",
    "asyncpg==0.31.0",
    "alembic==1.17.1",
    "structlog==25.5.0",
    "sentry-sdk[fastapi]==2.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
]
# Measurement tooling for phase 0 only. Local Whisper stands in for AssemblyAI
# while no key is available; production transcription goes through
# TranscriptionProvider (ADR-01), never through this.
poc = [
    "faster-whisper==1.2.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# ruff - lint + format (CLAUDE.md section 6)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "packages", "tools"]
extend-exclude = ["tools/datasets", ".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "T20",       # no print() - CLAUDE.md section 8
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "ASYNC",
    "S",         # bandit
    "FIX",       # no TODO/FIXME left behind - CLAUDE.md section 8
]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]      # assert is expected in tests
"tools/**" = ["T20"]          # measurement scripts print their results

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy - strict on packages/ and apps/api/app/ (CLAUDE.md section 6)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["packages", "apps/api/app"]
# apps/api is the import root: the package is apps/api/app, so `app.config`
# only resolves when its parent directory is on the path.
mypy_path = ["packages", "apps/api"]
explicit_package_bases = true
namespace_packages = true

# ---------------------------------------------------------------------------
# pytest - the 70% coverage gate applies to apps/api once it exists
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api", "packages", "tools"]
# Same import root as mypy, so tests and type checking agree.
pythonpath = ["apps/api", "packages"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["apps/api/app", "packages"]

[tool.coverage.report]
fail_under = 70
show_missing = true
