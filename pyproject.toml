# Tooling configuration for the whole Python side of the monorepo.
# No application dependency is declared here yet: FastAPI, SQLAlchemy, Celery
# and the provider SDKs arrive with the backend lot (CLAUDE.md section 2).

[project]
name = "novabrief"
version = "0.1.0"
description = "NovaBrief — monorepo tooling root (Novafrik)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.0",
    "sqlalchemy[asyncio]==2.0.45",
    "asyncpg==0.31.0",
    "alembic==1.17.1",
    "structlog==25.5.0",
    "sentry-sdk[fastapi]==2.44.0",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.11.0",
    "email-validator==2.3.0",
    "redis==6.4.0",
    # Runtime, not just tests: ResendProvider calls the email API over HTTP.
    "httpx==0.28.1",
    # Windows ships no time zone database, so `zoneinfo` finds nothing without
    # this. Data only, no code: it is what lets a timezone be rejected at the
    # boundary instead of failing months later inside a scheduled job.
    "tzdata==2026.3",
    # S3 client for Cloudflare R2 (and MinIO in development). Heavier than the
    # rest of this list, and taken deliberately: presigned URLs are the access
    # control on every meeting recording, and hand-rolling SigV4 to save an
    # image layer would put that on our own signing code.
    "aioboto3==15.5.0",
    # The processing queue and its scheduler (section 15.1). Redis is already a
    # dependency, so this adds a worker runtime rather than a datastore.
    "celery[redis]==5.6.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
]
# Measurement tooling for phase 0 only. Local Whisper stands in for AssemblyAI
# while no key is available; production transcription goes through
# TranscriptionProvider (ADR-01), never through this.
poc = [
    "faster-whisper==1.2.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# ruff - lint + format (CLAUDE.md section 6)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "packages", "tools"]
extend-exclude = ["tools/datasets", ".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "T20",       # no print() - CLAUDE.md section 8
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "ASYNC",
    "S",         # bandit
    "FIX",       # no TODO/FIXME left behind - CLAUDE.md section 8
]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# assert is expected in tests, and so are literal passwords and tokens:
# flagging them would push fixtures into indirection for no security gain.
"**/tests/**" = ["S101", "S105", "S106"]
"tools/**" = ["T20"]          # measurement scripts print their results

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy - strict on packages/ and apps/api/app/ (CLAUDE.md section 6)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["packages", "apps/api/app"]
# apps/api is the import root: the package is apps/api/app, so `app.config`
# only resolves when its parent directory is on the path.
mypy_path = ["packages", "apps/api"]
explicit_package_bases = true
namespace_packages = true

# The AWS SDK ships no type information. Scoped to these modules on purpose:
# a global ignore_missing_imports would also swallow a typo in one of our own
# imports, which is exactly the mistake strict mode exists to catch.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "boto3.*", "celery.*"]
ignore_missing_imports = true

# Celery's task decorator is untyped, so every task it wraps is reported as
# untyped too. Scoped to the task modules, which are thin wrappers over
# services that are themselves checked strictly.
[[tool.mypy.overrides]]
module = ["app.tasks.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest - the 70% coverage gate applies to apps/api once it exists
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api", "packages", "tools"]
# Same import root as mypy, so tests and type checking agree.
pythonpath = ["apps/api", "packages"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Every warning is an error, because a warning nobody reads is a bug
    # waiting for production.
    "error",
    # Except this one, which comes from Starlette's TestClient reaching for an
    # anyio alias that moved. It is not ours to fix, and it is the only way to
    # drive a WebSocket in a test. Named precisely so a different deprecation
    # still fails the suite.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["apps/api/app", "packages"]

[tool.coverage.report]
fail_under = 70
show_missing = true
