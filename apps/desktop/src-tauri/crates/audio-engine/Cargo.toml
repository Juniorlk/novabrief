[package]
name = "audio-engine"
description = "WASAPI capture (microphone + system loopback), resampling, drift compensation and Opus encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
audiopus = "0.2.0"
ogg = "0.9.2"
rubato = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Media_KernelStreaming", "Win32_System_Threading", "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage"] }

[dev-dependencies]
