[package]
name = "vault"
description = "Encrypted local storage for recordings in progress (EF-17, section 16.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# AES-256-GCM, as section 16.3 requires. The RustCrypto implementation rather
# than a binding to a C library: no build toolchain to carry into the Windows
# installer, and the installer has a 15 MB budget (EF-10).
aes-gcm = "0.10.3"
hkdf = "0.12.4"
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
