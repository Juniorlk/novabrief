name: CI

# Lint + tests for all three languages on every PR. The Rust job runs on Windows:
# the audio engine depends on WASAPI and only builds usefully there
# (CLAUDE.md section 10). Jobs call the tools directly rather than through
# `make`, which is not present by default on Windows runners.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # rust-toolchain.toml pins the channel and components.
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  python:
    name: Python
    runs-on: ubuntu-latest

    # A real PostgreSQL, because the isolation the product depends on is
    # enforced by the database. Row-Level Security cannot be exercised against
    # SQLite or a mock: a test that never touches PostgreSQL can only prove
    # that the application filters work, which is the layer ADR-04 says not to
    # rely on alone.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabrief
          POSTGRES_PASSWORD: novabrief
          POSTGRES_DB: novabrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novabrief"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # A real S3 implementation, for the same reason PostgreSQL is real: only
      # a server can say whether a presigned URL is signed correctly. Against a
      # double those tests prove our own arithmetic and nothing else.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: novabrief
          MINIO_ROOT_PASSWORD: novabrief-dev-secret
          MINIO_DEFAULT_BUCKETS: novabrief-audio
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # The API connects as the restricted role; a superuser would bypass RLS
      # and every isolation test would pass while proving nothing.
      TEST_DATABASE_URL: postgresql+asyncpg://novabrief_app:novabrief-app-dev@localhost:5432/novabrief
      TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://novabrief:novabrief@localhost:5432/novabrief
      DATABASE_ADMIN_URL: postgresql+asyncpg://novabrief:novabrief@localhost:5432/novabrief
      TEST_R2_ENDPOINT: http://localhost:9000
      TEST_R2_ACCESS_KEY_ID: novabrief
      TEST_R2_SECRET_ACCESS_KEY: novabrief-dev-secret
      TEST_R2_BUCKET_AUDIO: novabrief-audio

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create the restricted application role
        # The same script docker-compose mounts locally, so the two
        # environments cannot drift into disagreeing about the role's rights.
        env:
          PGPASSWORD: novabrief
        run: psql -h localhost -U novabrief -d novabrief -v ON_ERROR_STOP=1 -f infra/postgres-init/01-app-role.sql

      - name: Apply migrations
        working-directory: apps/api
        run: python -m alembic upgrade head

      - name: Ruff (lint)
        run: python -m ruff check --output-format=github .

      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: mypy --strict
        run: python -m mypy

      - name: pytest
        run: python -m pytest

      - name: Check that the database tests actually ran
        # They skip when no database is reachable, which is right on a laptop
        # and wrong here: a green run that quietly skipped T-07 is worse than
        # no run at all, because it looks like proof.
        run: |
          set -euo pipefail
          python -m pytest apps/api/tests/test_rls_isolation.py             apps/api/tests/test_auth_service.py             apps/api/tests/test_storage.py -q --no-header | tee result.txt
          if grep -qi "skipped" result.txt; then
            echo "::error::database or storage tests were skipped; T-07 and the presigned-URL checks were not verified"
            exit 1
          fi

  node:
    name: Node / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Vitest
        run: pnpm run test

  stack:
    name: Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build

      - name: Wait for the API to answer
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never answered on /health"
          exit 1

      - name: Check the exit criterion of lot L0
        run: |
          set -euo pipefail
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          # Readiness must see a real database, which is what proves the stack
          # is wired rather than merely running.
          curl -sf http://localhost:8000/health/ready | tee /dev/stderr | grep -q '"database":"ok"'

      - name: Show logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        working-directory: infra
        run: docker compose down -v

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::A .env file is tracked by Git. Revoke the exposed secrets."
            exit 1
          fi
          echo "OK: no .env tracked by Git."

      - name: Report the .env.example surface
        run: |
          missing=$(grep -nE '^[A-Z0-9_]+=$' .env.example | wc -l)
          total=$(grep -cE '^[A-Z0-9_]+=' .env.example)
          echo "$total variables declared in .env.example ($missing without an example comment)."
